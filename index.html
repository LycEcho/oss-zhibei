<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开源选型 · 先懂类型，再选项目</title>
<style>
  :root{
    --bg:#f6f7fa; --bg2:#ffffff; --ink:#1a2233; --ink2:#5a6478; --line:#e4e8ef;
    --brand:#4f46e5; --brand-soft:#eef0fe; --brand-mid:#c7cbfa;
    --ok:#0e8a5f; --ok-soft:#e8f6f0;
    --warn:#b45309; --warn-soft:#fdf3e3;
    --bad:#c23b3b; --bad-soft:#fdeaea;
    --obs:#5b6b8c; --obs-soft:#edf0f6;
    --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.05);
  }
  html.dark{
    --bg:#0f1420; --bg2:#171e2e; --ink:#e8ecf5; --ink2:#9aa4bb; --line:#2a3247;
    --brand:#8b93ff; --brand-soft:#232848; --brand-mid:#4a4f8a;
    --ok:#4fd39a; --ok-soft:#12301f;
    --warn:#e8b04b; --warn-soft:#33270f;
    --bad:#ef7c7c; --bad-soft:#3a1a1a;
    --obs:#9fb0d4; --obs-soft:#1d2536;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.75 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;transition:background .25s,color .25s}
  code{background:var(--obs-soft);padding:1px 7px;border-radius:6px;font-size:13px}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}

  header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .hd{display:flex;align-items:center;gap:14px;padding:12px 0}
  .logo{font-weight:800;font-size:16.5px;cursor:pointer;white-space:nowrap}
  .logo b{color:var(--brand)}
  .hd .search{flex:1;position:relative;max-width:520px;margin:0 auto}
  .hd .search input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--line);border-radius:99px;background:var(--bg2);color:var(--ink);font-size:14px;outline:none;transition:border .2s,box-shadow .2s}
  .hd .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .hd .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink2);fill:none}
  .theme{border:1px solid var(--line);background:var(--bg2);color:var(--ink2);padding:7px 13px;border-radius:99px;cursor:pointer;font-size:13px;white-space:nowrap;transition:all .2s}
  .theme:hover{border-color:var(--brand);color:var(--brand)}

  .sug{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:none;max-height:60vh;overflow-y:auto;z-index:60}
  .sug.on{display:block}
  .sug .grp{font-size:11.5px;font-weight:700;color:var(--ink2);padding:9px 16px 3px;letter-spacing:1px}
  .sug .item{padding:10px 16px;cursor:pointer;display:flex;align-items:center;gap:10px}
  .sug .item:hover{background:var(--brand-soft)}
  .sug .item .nm{font-weight:600;font-size:14px}
  .sug .item .ds{font-size:12.5px;color:var(--ink2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sug .item .tp{font-size:11px;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:2px 9px;white-space:nowrap}
  .sug .none{padding:16px;font-size:13.5px;color:var(--ink2);text-align:center;line-height:1.7}

  .home-hero{text-align:center;padding:64px 0 30px}
  .home-hero h1{font-size:30px;letter-spacing:1px;margin-bottom:12px}
  .home-hero h1 b{color:var(--brand)}
  .home-hero .tag{color:var(--ink2);font-size:15.5px;max-width:560px;margin:0 auto 28px}
  .home-hero .tag b{color:var(--ink);font-weight:600}
  .bigsearch{position:relative;max-width:600px;margin:0 auto}
  .bigsearch input{width:100%;padding:15px 20px 15px 48px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg2);color:var(--ink);font-size:15.5px;outline:none;transition:all .2s;box-shadow:var(--shadow)}
  .bigsearch input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .bigsearch svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:var(--ink2);fill:none}
  .hints{text-align:center;color:var(--ink2);font-size:13px;margin-top:14px}
  .hints span{cursor:pointer;border-bottom:1px dashed var(--brand-mid);margin:0 6px;color:var(--brand)}
  .hints span:hover{border-bottom-style:solid}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:8px 0 26px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}.home-hero{padding:40px 0 20px}}
  .tcard{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow);position:relative}
  .tcard:hover{border-color:var(--brand);transform:translateY(-2px)}
  .tcard h3{font-size:16.5px;margin-bottom:5px}
  .tcard p{font-size:13.5px;color:var(--ink2);line-height:1.65;min-height:44px}
  .tcard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tcard .m{font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--obs-soft);color:var(--obs)}
  .tcard .m.ok{background:var(--ok-soft);color:var(--ok)}
  .tcard .m.bl{background:var(--brand-soft);color:var(--brand)}
  .later{color:var(--ink2);font-size:12.5px;text-align:center;padding:4px 0 10px}
  .later span{background:var(--bg2);border:1px dashed var(--line);border-radius:99px;padding:3px 12px;margin:0 4px;display:inline-block}

  .crumb{padding:20px 0 0;font-size:13.5px;color:var(--ink2)}
  .crumb a{cursor:pointer;color:var(--brand)}
  .p-hero{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;margin:14px 0 16px;box-shadow:var(--shadow)}
  .p-hero h1{font-size:24px;margin-bottom:6px}
  .p-hero .sub{color:var(--ink2);font-size:14.5px;max-width:780px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
  .badge{font-size:11.5px;padding:4px 11px;border-radius:99px;background:var(--obs-soft);color:var(--obs);font-weight:600}
  .badge.v{background:var(--ok-soft);color:var(--ok)}
  .badge.f{background:var(--brand-soft);color:var(--brand)}

  .verdict{background:linear-gradient(135deg,var(--brand-soft),transparent);border:1px solid var(--brand-mid);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px}
  .verdict h2{font-size:16px;margin-bottom:12px;color:var(--brand)}
  .vrow{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:9px;flex-wrap:wrap}
  .vrow .segname{font-size:12px;color:var(--obs);background:var(--obs-soft);padding:3px 10px;border-radius:99px;white-space:nowrap;margin-top:2px}
  .vrow .pick{font-weight:700;font-size:15px;white-space:nowrap}
  .vrow .pick small{font-weight:500;color:var(--ink2);font-size:12px;margin-left:6px}
  .vrow .why{flex:1;min-width:220px;font-size:13.5px;color:var(--ink2)}

  details.box{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
  details.box>summary{padding:16px 22px;font-weight:700;font-size:15px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;user-select:none}
  details.box>summary::-webkit-details-marker{display:none}
  details.box>summary::before{content:"+";width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;transition:transform .2s}
  details.box[open]>summary::before{transform:rotate(45deg)}
  details.box .inner{padding:2px 22px 20px;border-top:1px solid var(--line)}
  details.box>summary:hover{color:var(--brand)}

  h4.sec{font-size:14.5px;margin:18px 0 10px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--ink2);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  ul.plain{list-style:none} ul.plain li{padding:4px 0 4px 18px;position:relative;color:var(--ink2);font-size:13.5px}
  ul.plain li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--brand)}

  .segblock{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--bg)}
  .segblock h5{font-size:14px;margin-bottom:10px}
  .segblock h5 .tag{font-size:11px;font-weight:600;color:var(--obs);background:var(--obs-soft);padding:2px 9px;border-radius:99px;margin-left:7px}
  .risk{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--warn);margin:9px 0}
  .edge{border-left:3px solid var(--obs);background:var(--obs-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--obs);margin:9px 0}

  .deadzone{border:1.5px dashed color-mix(in srgb,var(--bad) 50%,transparent);border-radius:12px;padding:13px 17px;background:var(--bad-soft);margin-bottom:10px}
  .deadzone b{color:var(--bad)}
  .deadzone p{font-size:13.5px}
  .deadzone .st{font-size:12px;color:var(--ink2)}
  .legal{border:1.5px solid color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft);border-radius:12px;padding:14px 18px;font-size:13.5px;margin-bottom:10px}
  .myth{columns:2;column-gap:12px}
  .myth div{border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:13.5px;background:var(--bg);margin-bottom:8px;break-inside:avoid}
  .myth b{color:var(--bad);font-size:13px}
  @media(max-width:720px){.myth{columns:1}}

  .funnelrow{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .funnelrow .fl{width:130px;font-size:13px;color:var(--ink2);text-align:right;flex-shrink:0}
  .funnelrow .bar{height:30px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;padding:0 12px;font-size:12.5px;font-weight:600;min-width:80px}
  .funnelrow .fx{font-size:12px;color:var(--ink2);flex:1;min-width:180px}

  .stamp{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin:16px 0;font-size:12.5px;color:var(--ink2)}
  .stamp .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex-shrink:0}

  footer{text-align:center;color:var(--ink2);font-size:12px;padding:26px 0 36px}
  .page{display:none}.page.on{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .loading{text-align:center;color:var(--ink2);padding:80px 0;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="logo" onclick="go('home')">开源<b>选型</b></div>
      <div class="search">
        <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="搜类型或项目，如：网关、ollama、rea、沙箱…" autocomplete="off">
        <div class="sug" id="sug"></div>
      </div>
      <button class="theme" id="themeBtn"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="page on" id="pg-home">
    <div class="home-hero">
      <h1>先懂<b>类型</b>，再选<b>项目</b></h1>
      <p class="tag">每个开源类型一篇「选型意见」：<b>默认选谁、什么情况换、不适合谁</b>。<br>内容由 AI 起草、人工核验，每个判断都挂证据和日期。</p>
      <div class="bigsearch">
        <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q2" type="text" placeholder="试试搜：网关、ollama、rea、沙箱、token…" autocomplete="off">
        <div class="sug" id="sug2"></div>
      </div>
      <div class="hints">热门：<span onclick="fillSearch('网关')">网关</span><span onclick="fillSearch('ollama')">ollama</span><span onclick="fillSearch('逆向')">逆向</span><span onclick="fillSearch('沙箱')">agent 沙箱</span></div>
    </div>
    <div class="grid" id="typeCards"></div>
    <div class="later">即将探索（下一期发现漏斗候选）：<span>自托管工具箱</span><span>知识库 / RAG</span><span>游戏移植</span><span>Agent 技能包生态</span></div>
  </div>
  <div id="rendered"><div class="loading" id="loading">正在加载数据库…（data/types/ 下的类型文件）</div></div>
</main>

<footer id="foot" style="visibility:hidden">开源选型 — 数据截止 2026-10-20 · AI 起草、待人审核验 · 内容规范见 docs/</footer>

<script src="data/types.js"></script>
<script>
/* ═══════════ 按清单加载数据库 ═══════════ */
const $=s=>document.querySelector(s), R=$("#rendered");
(function loadAll(){
  let done=0, files=window.TYPE_MANIFEST||[];
  if(!files.length){init();return;}
  files.forEach(src=>{
    const s=document.createElement("script");
    s.src=src;
    s.onload=()=>{ if(++done===files.length) init(); };
    s.onerror=()=>{ console.warn("数据文件加载失败:",src); if(++done===files.length) init(); };
    document.head.appendChild(s);
  });
  setTimeout(()=>{ if(!window.__READY){ $("#loading").textContent="数据加载异常 —— 请确认通过本地服务器或 GitHub Pages 访问（本地双击时请保持 data/ 目录与 index.html 在一起）"; } },4000);
})();

function init(){
  window.__READY=true;
  const TYPES=window.TYPE_DATA||[];
  if(!TYPES.length){ $("#loading").textContent="数据库为空 —— 请检查 data/types/ 下的类型文件"; return; }
  $("#loading")&&($("#loading").remove());
  $("#foot").style.visibility="visible";

  /* ═══════════ 首页卡片 ═══════════ */
  $("#typeCards").innerHTML=
    TYPES.filter(t=>!t.isFunnel).map(t=>`<div class="tcard" onclick="go('t-${t.id}')" data-n="${t.name}">
      <h3>${t.name}</h3><p>${t.one}</p>
      <div class="meta">${t.status==="ok"?`<span class="m ok">● 默认推荐已定</span>`:`<span class="m bl">◐ 观察中 · 照实说还没推荐</span>`}<span class="m">${t.count||""} 个项目</span><span class="m">核验 ${t.date}</span></div></div>`).join("")+
    TYPES.filter(t=>t.isFunnel).map(t=>`<div class="tcard" onclick="go('t-${t.id}')" data-n="${t.name}">
      <h3>${t.name}</h3><p>${t.one}</p>
      <div class="meta"><span class="m bl">方法论</span><span class="m">僵尸率 2/11 → 0</span></div></div>`).join("");

  /* ═══════════ 各类型页渲染 ═══════════ */
  R.innerHTML=TYPES.map(t=>{
    if(t.isFunnel)return funnelPage(t);
    if(t.isObs)return obsPage(t);
    return typePage(t);
  }).join("");

  buildIndex(TYPES);
}

function obsPage(t){
  return `<div class="page" id="t-${t.id}">
  <div class="crumb"><a onclick="go('home')">← 全部类型</a> / ${t.name}</div>
  <div class="p-hero"><h1>${t.name}</h1><p class="sub">${t.one}</p>
    <div class="badges"><span class="badge f">发现来源：${t.src}</span><span class="badge">裁决：入池留痕，暂不建类型页</span></div></div>
  <div class="p-hero" style="padding:16px 22px;background:var(--obs-soft);border-color:transparent">
    <b style="color:var(--obs);font-size:14px">为什么还没有推荐？</b>
    <p style="font-size:13.5px;color:var(--ink2);margin-top:4px">${t.obsNote||""}</p></div>
  <div class="p-hero"><table><thead><tr><th>项目</th><th>一句话</th><th>细分</th><th>发现证据</th></tr></thead><tbody>
    ${(t.obsList||[]).map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td style="white-space:nowrap">${r[3]}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="stamp"><span class="dot" style="background:var(--obs)"></span>观察区项目均为「线索层」证据 · 定期复查双圈化与活跃度</div></div>`;
}

function funnelPage(t){
  return `<div class="page" id="t-${t.id}">
  <div class="crumb"><a onclick="go('home')">← 全部类型</a> / ${t.name}</div>
  <div class="p-hero"><h1>${t.name} · 本期实测</h1><p class="sub">${t.one}</p>
    <div class="badges">${(t.badges||[]).map(b=>`<span class="badge ${b[0]}">${b[1]}</span>`).join("")}</div></div>
  <div class="p-hero"><h4 class="sec" style="margin-top:0">四层漏斗 · 数据流转</h4>
    ${(t.steps||[]).map(s=>`<div class="funnelrow"><div class="fl">${s[0]}</div><div class="bar" style="width:${s[3]}%">${s[1]}</div><div class="fx">${s[2]}</div></div>`).join("")}</div>
  <div class="p-hero"><h4 class="sec" style="margin-top:0">规范如何防「开头不可靠」</h4>
    <table><thead><tr><th>机制</th><th>解决什么</th></tr></thead><tbody>
    ${(t.mechs||[]).map(m=>`<tr><td><b>${m[0]}</b></td><td>${m[1]}</td></tr>`).join("")}
    </tbody></table></div>
  <div class="stamp"><span class="dot" style="background:var(--ok)"></span>${t.note||""}</div></div>`;
}

function typePage(t){
  const verdict=t.segs.map(s=>`<div class="vrow"><span class="segname">${s.name}</span><span class="pick">${s.def.proj}<small>${s.def.meta}</small></span><span class="why">${s.def.why.length>90?s.def.why.slice(0,88)+"…":s.def.why}</span></div>`).join("");
  const segs=t.segs.map(s=>`<div class="segblock"><h5>${s.name}<span class="tag">${s.tag}</span></h5>
      <div class="risk" style="border-color:var(--ok);background:var(--ok-soft);color:var(--ok)"><b>默认选谁：${s.def.proj}</b>（${s.def.meta}）<br><span style="color:var(--ink2);font-weight:400">${s.def.why}</span></div>
      ${s.risk?`<div class="risk">⚠ ${s.risk}</div>`:""}
      ${(s.swaps&&s.swaps.length)?`<h4 class="sec">什么情况换：</h4><ul class="plain" style="margin-left:4px">${s.swaps.map(w=>`<li><b>${w.t} → ${w.p}</b>${w.m?` <span style="font-size:12px;color:var(--ink2)">（${w.m}）</span>`:""}${w.d?`<br><span style="font-size:13px">${w.d}</span>`:""}</li>`).join("")}</ul>`:""}
      ${s.nofit?`<p style="font-size:13.5px;color:var(--ink2);margin-top:8px"><b style="color:var(--ink)">不适合：</b>${s.nofit}</p>`:""}
    </div>`).join("");
  return `<div class="page" id="t-${t.id}">
  <div class="crumb"><a onclick="go('home')">← 全部类型</a> / ${t.name}</div>
  <div class="p-hero"><h1>${t.name}</h1><p class="sub">${t.one}</p>
    <div class="badges"><span class="badge f">发现来源：${t.src}</span><span class="badge v">已采集 ${t.count} 个项目</span><span class="badge">核验 ${t.date}</span></div></div>

  <div class="verdict"><h2>⚡ 快速结论</h2>${verdict}<div style="font-size:12px;color:var(--ink2)">下面还有完整对比：选型维度、什么情况换、误区、警示区 —— 点开即用。</div></div>

  <details class="box"><summary>完整对比：适合谁、选型维度、形态详解</summary><div class="inner">
    <h4 class="sec">适合谁 / 不适合谁</h4>
    <table><tbody><tr><td style="width:50%"><b style="color:var(--ok)">✓ 适合</b><ul class="plain">${t.fit.map(x=>`<li>${x}</li>`).join("")}</ul></td>
    <td><b style="color:var(--bad)">✕ 不适合</b><ul class="plain">${t.nofit.map(x=>`<li>${x}</li>`).join("")}</ul></td></tr></tbody></table>
    <h4 class="sec">选型维度（选这类工具看这几条）</h4>
    <table><thead><tr><th>维度</th><th>说明</th></tr></thead><tbody>${t.dims.map(d=>`<tr><td><b>${d[0]}</b></td><td>${d[1]}</td></tr>`).join("")}</tbody></table>
    <h4 class="sec">形态分段详解</h4>${segs}
    ${t.edge?`<div class="edge">▸ ${t.edge}</div>`:""}
  </div></details>

  ${t.dead&&t.dead.length?`<details class="box" open><summary style="color:var(--bad)">🛑 停更警示区 / 边界物种（${t.dead.length}）</summary><div class="inner">
    ${t.dead.map(d=>`<div class="deadzone"><b>${d.t}</b><p>${d.b}</p><span class="st">${d.s}</span></div>`).join("")}
  </div></details>`:""}

  ${t.myths?`<details class="box"><summary>常见误区（${t.myths.length}）</summary><div class="inner"><div class="myth">${t.myths.map(m=>`<div><b>${m[0]}</b><br>${m[1]}</div>`).join("")}</div></div></details>`:""}
  ${t.legal?`<div class="legal">⚖ <b>${t.legal.split("：")[0]}：</b>${t.legal.split("：").slice(1).join("：")}</div>`:""}
  <div class="stamp"><span class="dot"></span>AI 起草（kscc/GLM）· 人核验：待定 · 核验日期 ${t.date} · 未完成人审，演示数据仅供参考</div></div>`;
}

/* ═══════════ 搜索索引 ═══════════ */
let INDEX=[];
function buildIndex(TYPES){
  INDEX=[];
  TYPES.forEach(t=>{
    if(!t.isFunnel&&!t.isObs)INDEX.push({type:"type",name:t.name,ds:t.one,tk:t.kw+t.name,tab:"t-"+t.id});
    if(t.isObs)(t.obsList||[]).forEach(r=>INDEX.push({type:"proj",name:r[0],ds:r[1],tk:r[0]+r[1]+r[2],tab:"t-"+t.id,seg:"观察区"}));
    if(t.segs)t.segs.forEach(s=>{
      INDEX.push({type:"proj",name:s.def.proj,ds:s.def.meta,tk:s.def.proj+(s.def.why||""),tab:"t-"+t.id,seg:s.name});
      (s.swaps||[]).forEach(w=>{if(w.m)INDEX.push({type:"proj",name:w.p,ds:w.t,tk:w.p+(w.d||""),tab:"t-"+t.id,seg:s.name})});
    });
    if(t.dead)t.dead.forEach(d=>INDEX.push({type:"proj",name:d.t.split("（")[0],ds:d.b,tk:d.t+d.b,tab:"t-"+t.id,seg:"警示区"}));
  });
}

/* ═══════════ 导航 ═══════════ */
function go(id){
  if(id==="home")id="pg-home";
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id===id));
  window.scrollTo({top:0});
  closeSug();
}
function fillSearch(v){$("#q2").value=v;doSearch(v,$("#sug2"));}

/* ═══════════ 搜索 ═══════════ */
function searchHits(v){
  v=v.trim().toLowerCase();if(!v)return[];
  return INDEX.filter(x=>(x.tk+" "+(x.ds||"")).toLowerCase().includes(v)).slice(0,12);
}
function sugHTML(hits,v){
  if(!v.trim())return"";
  if(!hits.length)return`<div class="none">没有找到「${v}」—— 这个查询已进入查询日志，会成为下一期发现漏斗的类型候选。</div>`;
  const tp=hits.filter(h=>h.type==="type"),pj=hits.filter(h=>h.type==="proj");
  return (tp.length?`<div class="grp">类型</div>`+tp.map(h=>`<div class="item" onclick="go('${h.tab}');closeSug()"><span class="nm">${h.name}</span><span class="ds">${h.ds||""}</span></div>`).join(""):"")
       +(pj.length?`<div class="grp">项目</div>`+pj.map(h=>`<div class="item" onclick="jumpProj('${h.tab}','${h.name.replace(/'/g,"")}')"><span class="nm">${h.name}</span><span class="ds">${h.ds||""}</span><span class="tp">${h.seg}</span></div>`).join(""):"");
}
function jumpProj(tab,name){
  go(tab);closeSug();
  setTimeout(()=>{
    document.querySelectorAll(".vrow,.deadzone,td,.segblock,.p-hero").forEach(el=>{
      if(el.textContent.includes(name)){
        el.scrollIntoView({behavior:"smooth",block:"center"});
        el.style.transition="box-shadow .3s";el.style.boxShadow="0 0 0 3px var(--brand)";
        setTimeout(()=>el.style.boxShadow="",1800);
        return;
      }
    });
  },80);
}
let sugTimer=null;
function bindSearch(inputId,sugId){
  const inp=$(inputId),sug=$(sugId);
  inp.addEventListener("input",()=>{
    clearTimeout(sugTimer);
    sugTimer=setTimeout(()=>{doSearch(inp.value,sug);},120);
  });
  inp.addEventListener("focus",()=>{if(inp.value)doSearch(inp.value,sug)});
  inp.addEventListener("keydown",e=>{if(e.key==="Escape"){inp.value="";closeSug();inp.blur();}});
}
function doSearch(v,sug){sug.innerHTML=sugHTML(searchHits(v),v);sug.classList.toggle("on",!!sug.innerHTML);}
function closeSug(){$("#sug").classList.remove("on");$("#sug2").classList.remove("on");}
document.addEventListener("click",e=>{if(!e.target.closest(".search")&&!e.target.closest(".bigsearch"))closeSug();});
bindSearch("#q","#sug");bindSearch("#q2","#sug2");

/* ═══════════ 深色 ═══════════ */
const btn=$("#themeBtn");
function setTheme(d){document.documentElement.classList.toggle("dark",d);btn.textContent=d?"☀️ 浅色":"🌙 深色";}
try{setTheme(matchMedia("(prefers-color-scheme:dark)").matches)}catch(e){setTheme(false)}
btn.onclick=()=>setTheme(!document.documentElement.classList.contains("dark"));
</script>
</body>
</html>
